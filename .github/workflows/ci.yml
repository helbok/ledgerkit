name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x
      - name: Restore
        run: dotnet restore LedgerKit.sln
      - name: Build
        run: dotnet build LedgerKit.sln --no-restore -c Release
      - name: Test
        run: dotnet test LedgerKit.sln --no-build -c Release
      - name: Format check
        run: dotnet format LedgerKit.sln --verify-no-changes
